name: Recover pending Instagram messages

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger durable message queue worker
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing APP_URL or CRON_SECRET repository Actions secret."
            exit 1
          fi
          APP_URL="${APP_URL%/}"
          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/internal/process-queue"
